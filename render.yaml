services:
  - type: web
    name: transglo-logistics
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn courier_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "transgloballogisticsnetwork.com,www.transgloballogisticsnetwork.com,.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://transgloballogisticsnetwork.com,https://www.transgloballogisticsnetwork.com,https://*.onrender.com"
